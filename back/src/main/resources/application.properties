spring.application.name=back

# src/main/resources/application.properties 에 추가
server.address=0.0.0.0
server.port=8080

spring.output.ansi.enabled=always

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=pknu
spring.datasource.password=1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 💡 로컬 Ollama 포트 및 Gemma 4 모델 지정
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4

# 💡 여행 일기 요약에 적당한 창의성 수치 (0.5 ~ 0.7)
spring.ai.ollama.chat.options.temperature=0.7

# 💡 Ollama 컨텍스트 창 크기를 1024 토큰으로 제한 (메모리 절약 및 속도 향상)
spring.ai.ollama.chat.options.num_ctx=8192

# application.properties
# 파일 한 개당 최대 용량
spring.servlet.multipart.max-file-size=10MB
# 한 요청당 최대 총 용량
spring.servlet.multipart.max-request-size=10MB

# 파일이 저장될 로컬 경로 (예시)
file.upload-dir=D:/upload/toyproject/