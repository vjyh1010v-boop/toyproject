name: Deploy Project

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 push되면 자동으로 실행

jobs:
  # 1. Front-end (React) 빌드
  deploy-front:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25' # 사용 중인 Node.js 버전에 맞게 수정하세요.

      - name: Build React
        run: |
          cd front        # 👈 중요: front 폴더로 이동
          npm install
          npm run build
          
      # TODO: 빌드된 front/build(또는 dist) 폴더를 S3나 Vercel 등으로 보낼 스크립트가 들어갈 자리입니다.

  # 2. Back-end (Spring Boot) 빌드
  deploy-back:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # 사용 중인 자바 버전에 맞게 수정하세요 (예: 11, 17, 21 등)
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x back/gradlew # 👈 중요: back 폴더 안의 gradlew에 권한 부여

      - name: Build with Gradle
        run: |
          cd back         # 👈 중요: back 폴더로 이동
          ./gradlew clean build -x test # 테스트를 제외하고 빌드 (속도 향상)
          
      # TODO: 빌드된 back/build/libs/*.jar 파일을 EC2나 Docker 등으로 보낼 스크립트가 들어갈 자리입니다.